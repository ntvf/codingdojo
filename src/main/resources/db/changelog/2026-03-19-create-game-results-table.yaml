databaseChangeLog:
  - changeSet:
      id: create-game-results-table
      author: copilot
      changes:
        - createTable:
            tableName: game_results
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: room_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: "Reference to Room"
              - column:
                  name: player_id
                  type: UUID
                  constraints:
                    nullable: false
                  remarks: "Reference to Player"
              - column:
                  name: player_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: game_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: survival_ticks
                  type: INT
              - column:
                  name: final_direction
                  type: VARCHAR(10)
              - column:
                  name: food_eaten
                  type: INT
              - column:
                  name: completed_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            tableName: game_results
            columns:
              - column:
                  name: player_id
            indexName: idx_game_results_player_id
        - createIndex:
            tableName: game_results
            columns:
              - column:
                  name: room_id
            indexName: idx_game_results_room_id
        - createIndex:
            tableName: game_results
            columns:
              - column:
                  name: score
            indexName: idx_game_results_score
        - createIndex:
            tableName: game_results
            columns:
              - column:
                  name: completed_at
            indexName: idx_game_results_completed_at
