spring:
  application:
    name: server
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    # Uses Testcontainers PostgreSQL via @ServiceConnection
    # Connection details auto-configured by Spring Boot Testcontainers
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  testcontainers:
    postgresql:
      enabled: true
